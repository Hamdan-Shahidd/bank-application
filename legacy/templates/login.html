{% extends "base.html" %}
{% block content %}
<h1>Log in</h1>
<form method="POST">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <input name="gmail" type="email" placeholder="Email" required>
  <input name="password" type="password" placeholder="Password" required>

  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
</form>
{% endblock %}
